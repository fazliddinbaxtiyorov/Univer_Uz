<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Coins - UniBase</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .pricing-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .price-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .price-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border-color: #6366f1;
        }
        .price-card.popular {
            border: 2px solid #6366f1;
        }
        .popular-badge {
            background: #6366f1;
            color: white;
            position: absolute;
            top: 15px;
            right: -35px;
            transform: rotate(45deg);
            padding: 5px 40px;
            font-size: 12px;
            font-weight: 700;
        }
        .coin-icon { font-size: 50px; margin-bottom: 20px; }
        .coin-amount { font-size: 2rem; font-weight: 800; color: #1e293b; }
        .price-tag { font-size: 1.25rem; color: #64748b; margin: 15px 0 30px; }
        .buy-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .price-card:hover .buy-btn {
            background: #6366f1;
        }
    </style>
</head>
<body>

<div style="text-align: center; margin-top: 50px;">
    <h1>Get More Coins</h1>
    <p style="color: #64748b;">Unlock premium tests and AI writing analysis</p>
</div>

<div class="pricing-container">
    <div class="price-card">
        <div class="coin-icon">🪙</div>
        <div class="coin-amount">100 Coins</div>
        <div class="price-tag">10,000 UZS</div>
        <form action="{% url 'buy_coins' %}" method="POST">
            {% csrf_token %}
            <input type="hidden" name="amount" value="100">
            <button type="submit" class="buy-btn">Buy Now</button>
        </form>
    </div>

    <div class="price-card popular">
        <div class="popular-badge">BEST</div>
        <div class="coin-icon">💰</div>
        <div class="coin-amount">500 Coins</div>
        <div class="price-tag">45,000 UZS</div>
        <form action="{% url 'buy_coins' %}" method="POST">
            {% csrf_token %}
            <input type="hidden" name="amount" value="500">
            <button type="submit" class="buy-btn">Buy Now</button>
        </form>
    </div>

    <div class="price-card">
        <div class="coin-icon">💎</div>
        <div class="coin-amount">1000 Coins</div>
        <div class="price-tag">80,000 UZS</div>
        <form action="{% url 'buy_coins' %}" method="POST">
            {% csrf_token %}
            <input type="hidden" name="amount" value="1000">
            <button type="submit" class="buy-btn">Buy Now</button>
        </form>
    </div>
</div>

<div style="text-align: center;">
    <a href="{% url 'profile' %}" style="color: #64748b; text-decoration: none;">← Back to Profile</a>
</div>

</body>
</html>
