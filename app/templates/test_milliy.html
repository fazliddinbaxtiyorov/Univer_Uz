<!DOCTYPE html>
<html lang="uz">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - UniBase</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'responsive.css' %}">
    <style>
        /* ================= GLOBAL & LAYOUT ================= */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #eef2f8; }

        .layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ================= TOPBAR (HEADER) ================= */
        .topbar {
            position: sticky; top: 0; z-index: 1000;
            background: #0f2742; color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 30px;
        }
        .logo-text { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; }

        .progress-box { width: 300px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #4cc9f0; transition: 0.4s; }

        .timer-display {
            font-size: 18px; font-weight: 700; background: #122f52;
            padding: 6px 15px; border-radius: 10px; border: 1px solid #4cc9f0;
        }

        /* ================= QUESTION CARD ================= */
        .question-card {
            background: #ffffff; border-radius: 16px; padding: 25px;
            margin-bottom: 22px; border: 1px solid #e3e8f1;
            box-shadow: 0 6px 18px rgba(15,39,66,0.06);
        }
        .q-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; display: block; }

        /* Django form style integration */
        .question-card p { margin: 0; }
        .question-card ul { list-style: none; padding: 0; }
        .question-card li {
            padding: 12px 15px; border: 1px solid #e4e9f3;
            border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .question-card li:hover { background: #f7faff; border-color: #0f2742; }
        .question-card input[type="radio"] { margin-right: 10px; accent-color: #0f2742; }

        /* ================= NAVIGATOR ================= */
        .navigator {
            position: sticky; top: 90px;
            background: #fff; border-radius: 16px; padding: 20px;
            border: 1px solid #e3e8f1; box-shadow: 0 6px 18px rgba(15,39,66,0.06);
        }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .nav-item {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; border: 1px solid #dde3ef; font-weight: 600;
            text-decoration: none; color: #0f2742; transition: 0.2s;
        }
        .nav-item.answered { background: #e8fff1; border-color: #38b000; color: #38b000; }
        .nav-item:hover { background: #f0f4f8; }

        .btn-yakunlash {
            background: #4cc9f0; border: none; padding: 12px; width: 100%;
            border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 20px;
        }

        @media(max-width: 900px) { .layout { grid-template-columns: 1fr; } .navigator { position: static; } }
    </style>
</head>
<body>

<div class="topbar">
    <a href="{% url 'home' %}" class="logo-text">UniBase</a>

    <div class="progress-box">
        <div class="progress-bar" id="p-bar"></div>
    </div>

    <div class="timer-display" id="timer-display">60:00</div>

    <button type="button" class="submit-btn" style="background:#4cc9f0; border:none; padding:8px 18px; border-radius:10px; font-weight:600; cursor:pointer;" onclick="document.getElementById('test-form').submit()">Submit</button>
</div>

<div class="layout">
    <main>
        <form method="POST" id="test-form">
            {% csrf_token %}

            {% for field in form %}
            <div class="question-card" id="q-{{ forloop.counter }}">
                <span class="q-title">
                    <strong style="color: #0f2742; margin-right: 10px;">{{ forloop.counter }}.</strong>
                    {{ field.label }}
                </span>
                <div class="options-wrapper">
                    {{ field }}
                </div>
            </div>
            {% endfor %}

            <div style="margin-top: 30px;">
                <button type="button" class="btn-yakunlash" onclick="document.getElementById('test-form').submit()">Testni Yakunlash →</button>

            </div>
        </form>
    </main>

    <aside>
        <div class="navigator">
            <h3 style="margin-top:0; margin-bottom:15px; font-size: 16px;">Savollar</h3>
            <div class="nav-grid">
                {% for field in form %}
                    <a href="#q-{{ forloop.counter }}" class="nav-item" id="nav-{{ forloop.counter }}">
                        {{ forloop.counter }}
                    </a>
                {% endfor %}
            </div>

            <div style="margin-top: 20px; font-size: 12px; color: #666;">
                <div style="display:flex; align-items:center; gap:5px;">
                    <span style="width:10px; height:10px; background:#e8fff1; border:1px solid #38b000; border-radius:2px;"></span>
                    Javob berilgan savollar
                </div>
            </div>
        </div>
    </aside>
</div>

<script>
    // 1. Timer (Vaqt hisoblagich)
    let totalSeconds = 60 * 60; // 60 daqiqa
    const timerDisplay = document.getElementById('timer-display');

    const timerInterval = setInterval(() => {
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;

        // Vaqtni formatlash (00:00)
        timerDisplay.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            alert("Vaqt tugadi! Test avtomatik topshiriladi.");
            document.getElementById('test-form').submit();
        }
        totalSeconds--;
    }, 1000);

    // 2. Navigator va Progress Bar-ni yangilash funksiyasi
    const totalQuestions = {{ form|length }};
    const radioGroups = document.querySelectorAll('.question-card');

    function updateProgress() {
        let answeredCount = 0;

        radioGroups.forEach((card, index) => {
            const radios = card.querySelectorAll('input[type="radio"]');
            const navItem = document.getElementById(`nav-${index + 1}`);

            // Guruhda belgilangan radio borligini tekshirish
            const isAnswered = Array.from(radios).some(r => r.checked);

            if (isAnswered) {
                answeredCount++;
                navItem.classList.add('answered'); // Navigatorni yashil qilish
            }
        });

        // Progress bar-ni yangilash
        const progressPercent = (answeredCount / totalQuestions) * 100;
        document.getElementById('p-bar').style.width = progressPercent + "%";
    }

    // Har bir radio tugmachaga bosilganda progressni yangilashni ulaymiz
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', updateProgress);
    });

    // Sahifa yuklanganda bir marta hisoblab qo'yish
    updateProgress();
</script>
</body>
</html>
