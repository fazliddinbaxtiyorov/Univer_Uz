{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTM Practice - UniBase</title>
     <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'responsive.css' %}">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-container">
                <a href="{% url 'home'%}" class="logo">UniBase</a>
                <nav>
                    <ul>
                        <li><a href="student-dashboard.html" data-translate="nav_dashboard">Dashboard</a></li>
                        <li><a href="../../user/templates/profile.html" data-translate="nav_profile">Profile</a></li>
                        <li><a href="personal-best.html" data-translate="nav_personal_best">Personal Best</a></li>
                        <li><a href="#" id="user-name-display"></a></li>
                        <li>
                            <select id="language-selector" class="language-selector">
                                <option value="en">English</option>
                                <option value="ru">Русский</option>
                                <option value="uz">O'zbekcha</option>
                            </select>
                        </li>
                        <li><a href="{% url 'home'%}" class="btn btn-secondary btn-sm"
                                data-translate="nav_logout">Logout</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" style="min-height: 40vh; display: flex; align-items: center;">
        <div class="container text-center">
            <h1 class="hero-title" data-translate="test_dtm_title">DTM</h1>
            <p class="hero-subtitle" data-translate="test_dtm_desc">Prepare for university entrance exams with realistic
                test simulations.</p>
        </div>
    </section>

    <!-- Tests Section -->
    <section class="section">
        <div class="container">
            <h2 class="mb-4">Available Tests</h2>
            <form method="post">
        {% csrf_token %}
        <select name="birinchi_fan" id="birinchi_fan" required onchange="updateSecondOptions()">
            <option value="">1-fan tanlang</option>
            <option value="Matematika">Matematika</option>
            <option value="Ona Tili">Ona Tili</option>
            <option value="Tarix">Tarix</option>
            <option value="Kimyo">Kimyo</option>
            <option value="Biologiya">Biologiya</option>
            <option value="Geografiya">Geografiya</option>
            <option value="Fizika">Fizika</option>
            <option value="Ingliz Tili">Ingliz Tili</option>
        </select>

        <select name="ikkinchi_fan" id="ikkinchi_fan" required>
            <option value="">2-fan tanlang</option>
            <option value="Matematika">Matematika</option>
            <option value="Ona Tili">Ona Tili</option>
            <option value="Tarix">Tarix</option>
            <option value="Kimyo">Kimyo</option>
            <option value="Biologiya">Biologiya</option>
            <option value="Geografiya">Geografiya</option>
            <option value="Fizika">Fizika</option>
            <option value="Ingliz Tili">Ingliz Tili</option>
        </select>
<button class="btn btn-primary" id="next-btn" type="submit">Boshlash</button>
    </form>

            <div class="grid grid-3" id="tests-container">

            </div>
        </div>
    </section>
</body>

</html>
