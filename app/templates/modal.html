.ai-container {

**JavaScript:**

<script>
function getAIExplanation(qId, userAns, testCat) {
    const resultDiv = document.getElementById('aiResultText');
    resultDiv.innerHTML = "<b>AI ishga tushdi...</b>";

    // URL manzili xato bo'lmasligi uchun / belgisiga e'tibor bering
    const targetUrl = "/modal/" + qId + "/";

    const xhr = new XMLHttpRequest();
    xhr.open("POST", targetUrl, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("X-CSRFToken", document.querySelector('[name=csrfmiddlewaretoken]').value);

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                const data = JSON.parse(xhr.responseText);
                resultDiv.innerHTML = data.explanation.replace(/\n/g, '<br>');
            } else {
                resultDiv.innerHTML = "Xatolik: Server javob bermadi (Status: " + xhr.status + ")";
            }
        }
    };

    const body = JSON.stringify({
        category: testCat,
        user_answer: userAns
    });

    xhr.send(body);
}
    .then(data => {
    let rawText = data.explanation;

    // Markdown formatini chiroyli HTML ga o'girish (oddiyroq usuli)
    let formattedText = rawText
        .replace(/### (.*)/g, '<h4 class="ai-title">$1</h4>') // Sarlavhalar
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')    // Qalin matn
        .replace(/> (.*)/g, '<blockquote class="ai-quote">$1</blockquote>') // Iqtiboslar
        .replace(/\n/g, '<br>'); // Qator ko'chirish

    resultDiv.innerHTML = `<div class="ai-container">${formattedText}</div>`;
})
</script>
